name: 验证修改版软件栈
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: component-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: Altars3668/altarscn-debs/.github/workflows/build-stack.yml@main
    with:
      force: true
      override-component: mutter
      override-ref: ${{ github.sha }}
